name: Build Samehadaku

concurrency:
  group: samehadaku-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Samehadaku/**'
      - '.github/workflows/build.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Create local.properties
        env:
          SAMEHADAKU_API: ${{ secrets.SAMEHADAKU_API }}
        shell: bash
        run: |
          touch local.properties
          printf 'SAMEHADAKU_API=%s\n' "$SAMEHADAKU_API" >> local.properties

      - name: Build Samehadaku
        run: |
          chmod +x gradlew
          ./gradlew :Samehadaku:make \
            -x lint \
            --stacktrace \
            --console=plain

      - name: Prepare plugin repository
        shell: bash
        run: |
          set -e
          mkdir -p output

          find Samehadaku/build -type f -name '*.cs3' \
            -exec cp -v {} output/ \;

          if ! find output -maxdepth 1 -type f -name '*.cs3' | grep -q .; then
            echo "::error::File .cs3 tidak ditemukan."
            exit 1
          fi

          PLUGIN_FILE="$(find output -maxdepth 1 -type f -name '*.cs3' -printf '%f\n' | head -n 1)"

          cat > output/plugins.json <<EOF
          [
            {
              "iconUrl": "https://samehadaku.li/favicon.ico",
              "apiVersion": 1,
              "repositoryUrl": "https://github.com/orensjill/IndoEscendol",
              "fileSize": 0,
              "status": 1,
              "language": "id",
              "authors": ["orensjill"],
              "tvTypes": ["Anime", "AnimeMovie", "OVA"],
              "version": 23,
              "internalName": "Samehadaku",
              "name": "Samehadaku",
              "description": "Plugin Samehadaku Indonesia",
              "url": "https://raw.githubusercontent.com/orensjill/IndoEscendol/builds/$PLUGIN_FILE"
            }
          ]
          EOF

          cat > output/repo.json <<'EOF'
          {
            "name": "IndoEscendol",
            "description": "Repositori plugin CloudStream",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/orensjill/IndoEscendol/builds/plugins.json"
            ]
          }
          EOF

          echo "=== File yang akan dipublikasikan ==="
          ls -lah output
          cat output/repo.json
          cat output/plugins.json

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: samehadaku-plugin
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish repository to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: output
          force_orphan: true
```
