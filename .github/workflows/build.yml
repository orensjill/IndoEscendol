name: Build Samehadaku

concurrency:
  group: samehadaku-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Samehadaku/**'
      - '.github/workflows/build.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Create local.properties
        env:
          SAMEHADAKU_API: ${{ secrets.SAMEHADAKU_API }}
        shell: bash
        run: |
          touch local.properties
          printf 'SAMEHADAKU_API=%s\n' "$SAMEHADAKU_API" >> local.properties

      - name: Build Samehadaku
        run: |
          chmod +x gradlew
          ./gradlew :Samehadaku:make \
            -x lint \
            --stacktrace \
            --console=plain

      - name: Collect Samehadaku plugin
        shell: bash
        run: |
          mkdir -p output

          find Samehadaku/build -type f -name '*.cs3' \
            -exec cp -v {} output/ \;

          echo "=== Samehadaku build output ==="
          ls -lah output

          if ! find output -maxdepth 1 -type f -name '*.cs3' | grep -q .; then
            echo "::error::Samehadaku .cs3 file was not generated."
            exit 1
          fi

      - name: Upload Samehadaku artifact
        uses: actions/upload-artifact@v4
        with:
          name: samehadaku-plugin
          path: output/*.cs3
          if-no-files-found: error
          retention-days: 14
