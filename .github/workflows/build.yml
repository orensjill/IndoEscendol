name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Samehadaku/**'
      - '.github/workflows/build.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Create local.properties
        env:
          ANIMASU_API: ${{ secrets.ANIMASU_API }}
          DUBBINDO_API: ${{ secrets.DUBBINDO_API }}
          GOMOV_API: ${{ secrets.GOMOV_API }}
          IDLIX_API: ${{ secrets.IDLIX_API }}
          KURAMANIME_API: ${{ secrets.KURAMANIME_API }}
          LAYARKACA_API: ${{ secrets.LAYARKACA_API }}
          NIMEGAMI_API: ${{ secrets.NIMEGAMI_API }}
          OPLOVERZ_API: ${{ secrets.OPLOVERZ_API }}
          OTAKUDESU_API: ${{ secrets.OTAKUDESU_API }}
          PENCURIMOVIE_API: ${{ secrets.PENCURIMOVIE_API }}
          SAMEHADAKU_API: ${{ secrets.SAMEHADAKU_API }}
          USEETV_API: ${{ secrets.USEETV_API }}
        shell: bash
        run: |
          touch local.properties
          for key in ANIMASU_API DUBBINDO_API GOMOV_API IDLIX_API KURAMANIME_API LAYARKACA_API NIMEGAMI_API OPLOVERZ_API OTAKUDESU_API PENCURIMOVIE_API SAMEHADAKU_API USEETV_API; do
            printf '%s=%s\n' "$key" "${!key}" >> local.properties
          done

      - name: Build plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson ensureJarCompatibility -x lint --continue

      - name: Collect build outputs
        shell: bash
        run: |
          mkdir -p output

          find . -type f \( -name '*.cs3' -o -name '*.jar' \) \
            -not -path './.git/*' \
            -not -path './output/*' \
            -exec cp -v {} output/ \;

          if [ -f build/plugins.json ]; then
            cp build/plugins.json output/
          fi

          echo "=== Build output files ==="
          ls -lah output

          if ! find output -maxdepth 1 -type f -name '*.cs3' | grep -q .; then
            echo "::error::No .cs3 plugin files were generated."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins
          path: output/*
          if-no-files-found: error
          retention-days: 14
